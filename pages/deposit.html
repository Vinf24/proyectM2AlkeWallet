<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="overflow-y-scroll">
    <div class="navbar nav-stack">
        <a class="btn btn-outline-primary position-absolute top-0 end-0 me-4 mt-3" href="../index.html"
            id="btnLogout">Logout</a>
    </div>
    <div id="dlgOverlay" class="dlgOverlay">
        <div class="alert-warning-custom center-stack" role="alert">
            <p class="mb-2">¿Seguro que deseas salir?</p>
            <div class="d-flex justify-content-center gap-2">
                <button id="goLogout" class="btn btn-danger btn-sm">Sí, salir</button>
                <button id="cancelLogout" class="btn btn-outline-light btn-sm">Cancelar</button>
            </div>
        </div>
    </div>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-9">
                <div class="main-title pb-4 text-center">Depositar</div>
                <form class="p-4 tarjeta">
                    <div class="form-group mb-3">
                        <label for="amount" class="mb-1">Monto a depositar:</label>
                        <input type="number" id="amount" class="form-control cont-data" placeholder="Ingrese monto">
                    </div>
                    <h2 class="mb-3 fw-normal" style=font-size:20px>Saldo Actual:</h2>
                    <div class="row mx-auto">
                        <input type="text" class="form-control show-data" id="saldo" disabled>
                        <p class="fs-4 fw-bold w-25 my-auto">$</p>
                    </div>
                    <div id="dlgDeposit" class="dlgOverlay">
                        <div class="alert-success-custom d-flex flex-column gap-1" role="alert">
                            <p class="alert-content" id="dlgDepositData"></p>
                            <div class="d-flex justify-content-center gap-2">
                                <button id="goDeposit" class="btn btn-success btn-sm">Entendido</button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3 entra" id="btnDeposit">Realizar depósito</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/pages/menu.html" class="btn btn-dark mt-3 surf" data-title="Menú Principal">Volver al
                        Menú
                        Principal</a>
                </div>
            </div>
        </div>
    </div>

    <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/alertAnimations.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/sesion.js"></script>
</body>

</html>
