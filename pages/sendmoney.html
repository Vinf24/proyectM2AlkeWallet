<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="overflow-y-scroll">
    <div class="navbar nav-stack">
        <a class="btn btn-outline-primary position-absolute top-0 end-0 me-4 mt-3" href="../index.html"
            id="btnLogout">Logout</a>
    </div>
    <div id="dlgCompleted" class="dlgOverlay">
        <div class="alert-success-custom center-stack justify-content-center" role="alert">
            <p id="sendOK" class="alert-content"></p>
        </div>
    </div>
    <div id="dlgOverlay" class="dlgOverlay">
        <div class="alert-warning-custom center-stack" role="alert">
            <p class="mb-2">¿Seguro que deseas salir?</p>
            <div class="d-flex justify-content-center gap-2">
                <button id="goLogout" class="btn btn-danger btn-sm">Sí, salir</button>
                <button id="cancelLogout" class="btn btn-outline-light btn-sm">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="dlgSend" class="dlgOverlay">
        <div class="alert-warning-custom center-stack w-75" role="alert">
            <p class="mb-3">¿Confirmar el Envio?</p>
            <div class="d-flex justify-content-center gap-2">
                <button id="btnSend" class="btn btn-danger btn-sm">Sí, enviar</button>
                <button id="cancelSend" class="btn btn-outline-light btn-sm">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="dlgUser" class="dlgOverlay">
        <div class="alert-warning-custom d-flex flex-column gap-1" role="alert">
            <p class="alert-content" id="dlgData"></p>
            <div class="d-flex justify-content-center gap-2">
                <button id="goSend" class="btn btn-danger btn-sm">Entendido</button>
            </div>
        </div>
    </div>
    <div id="dlgDelAdd" class="dlgOverlay">
        <div class="alert-info-custom d-flex flex-column gap-1" role="alert">
            <p class="alert-content" id="dlgDelAddData"></p>
            <div class="d-flex justify-content-center gap-2">
                <button id="goDelAdd" class="btn btn-light btn-sm">Entendido</button>
            </div>
        </div>
    </div>
    <div id="dlgDelete" class="dlgOverlay">
        <div class="alert-warning-custom m-auto d-flex flex-column gap-1 w-75" style="max-width: 380px;" role="alert">
            <p class="mb-2 mx-auto">¿Eliminar Contacto?</p>
            <div class="d-flex justify-content-center gap-2 mt-2">
                <button id="goDelete" class="btn btn-danger btn-sm">Sí, eliminar</button>
                <button id="cancelDelete" class="btn btn-outline-light btn-sm">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="dlgAlkeDetected" class="dlgOverlay">
        <div class="alert-info-custom m-auto py-3 px-2 d-flex flex-column w-75 gap-1" style="max-width: 380px;"
            role="alert">
            <p class="alert-content">Usuario Alke Detectado</p>
            <hr class="my-1">
            <p id="dlgAlkeData" class="fs-4 fw-bold text-center mb-1"></p>
            <div class="d-flex justify-content-center gap-2 mt-2">
                <button id="goAlkeAdd" class="btn btn-light btn-sm">Sí, continuar</button>
                <button id="cancelAlkeAdd" class="btn btn-light btn-sm">Cancelar</button>
            </div>
        </div>
    </div>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-9">
                <div class="main-title text-center">Enviar Dinero</div>
                <form class="px-4 py-2 tarjeta">
                    <div class="form-group mb-2">
                        <label class="py-2" for="contactSearchInput">Buscar en la agencia de transferencias:</label>
                        <input type="text" id="contactSearchInput" class="form-control cont-data"
                            placeholder="Buscar contacto..." autocomplete="off">
                        <ul id="contactList" class="list-group mx-auto d-none col-12 col-md-10"></ul>
                        <div class="text-center mt-3">
                            <p class="btn btn-dark d-none" id="listCancel">cancelar</p>
                        </div>
                    </div>
                </form>
                <div class="max-container text-end" id="contAddContact">
                    <button class="btn btn-outline-primary my-3 me-3" data-bs-toggle="modal"
                        data-bs-target="#contactoModal">
                        Agregar contacto
                    </button>
                </div>
                <div class="modal fade" id="contactoModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-light">
                                <h4 id="formTitle" class="modal-title">Agregar contacto</h4>
                                <button id="closeForm" type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="formAddContact" novalidate>
                                    <div class="row">
                                        <div class="mb-3 w-50">
                                            <label for="nombre" class="form-label">Nombre:</label>
                                            <input type="text" id="nombre" class="form-control pe-0 cont-data"
                                                placeholder="nombre..." required>
                                        </div>
                                        <div class="mb-3 w-50">
                                            <label for="apellido" class="form-label">Apellido:</label>
                                            <input type="text" id="apellido" class="form-control pe-0 cont-data"
                                                placeholder="apellido..." required>
                                        </div>
                                    </div>
                                    <div class="mb-3 w-75">
                                        <label for="cuenta" class="form-label">N° de CBU:</label>
                                        <input type="text" id="cuenta" inputmode="numeric" pattern="\d{8}"
                                            class="form-control cont-data" placeholder="01234567" required>
                                    </div>
                                    <div class="mb-3 w-75">
                                        <label for="nombre" class="form-label">Alias:</label>
                                        <input type="text" id="alias" class="form-control cont-data"
                                            placeholder="alias..." required>
                                    </div>
                                    <div class="mb-3 w-75">
                                        <label for="nombre" class="form-label">Nombre del Banco:</label>
                                        <input type="text" id="banco" class="form-control cont-data"
                                            placeholder="banco..." required>
                                    </div>
                                    <button class="btn btn-primary" type="submit" id="addContact">Guardar
                                        Contacto</button>
                                </form>
                                <div id="dlgContact" class="dlgOverlay">
                                    <div class="alert-warning-custom alert-stack" role="alert">
                                        <p class="alert-content" id="dlgContactData"></p>
                                        <div class="d-flex justify-content-center">
                                            <button id="goContact" class="btn btn-danger btn-sm">Entendido</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button id="cancelForm" class="btn btn-dark" data-bs-dismiss="modal">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <form>
                    <div class="px-4 py-2 tarjeta mt-3">
                        <div class="form-group mb-1">
                            <label class="pt-2 pb-1" for="inputAmount">Monto a enviar:</label>
                            <input type="number" id="inputAmount" class="form-control cont-data"
                                placeholder="Ingrese monto..." required>
                            <label for="inputAmount" class="text-detail ms-2 mt-2 user-select-none">Mínimo:
                                $1000 + $500 (Tax)</label>
                        </div>
                    </div>
                    <div class="d-none" id="dlgSelectedContact">
                        <button class="btn btn-primary mt-3 sale" type="submit" id="btnConfirm">Enviar</button>
                        <a class="btn btn-danger mt-3" id="delContact">Borrar Contacto</a>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="/pages/menu.html" class="btn btn-dark mt-3 surf" data-title="Menú Principal">Volver al
                        Menú
                        Principal</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/alertAnimations.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/contacts.js"></script>

</body>

</html>
